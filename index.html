<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malody Best 30 Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- レートの文字色アニメーション設定 --- */
        .rate-rainbow {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: rainbow-move 3s linear infinite;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.2));
        }

        @keyframes rainbow-move {
            to { background-position: 200% center; }
        }

        .rate-gold {
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .rate-silver {
            background: linear-gradient(45deg, #959595, #ffffff, #707070);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rate-normal { color: #3498db; }

        /* --- 基本デザイン --- */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        
        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #bdc3c7; color: white; font-weight: bold; transition: 0.3s; }
        .nav-btn.active { background: #3498db; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        .rating-display { text-align: center; font-size: 40px; font-weight: bold; margin: 20px 0; padding: 15px; background: #e8f4fd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #3498db; color: white; padding: 12px; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        input[type="number"] { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        
        .jacket-img { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; vertical-align: middle; margin-right: 10px; background: #eee; }
        .info-card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #3498db; }
        
        .save-btn { background: #27ae60; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px; width: 100%; font-size: 16px; }
        .save-btn:hover { background: #219150; }

        /* 画像化する時に背景が白くなるように指定 */
        #capture-area { background: white; padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Malody Best 30</h1>

    <div class="nav-buttons">
        <button class="nav-btn active" onclick="showScreen('input-screen')">Acc入力</button>
        <button class="nav-btn" onclick="showScreen('result-screen')">ベスト枠表示</button>
    </div>

    <div id="input-screen" class="screen active">
        <div class="info-card">
            <p>各曲のAccを入力してください。GitHubに画像を上げればジャケットも表示されます。</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')" style="cursor:pointer">曲名 ↕</th>
                    <th onclick="setSort('constant')" style="cursor:pointer">難易度 ↕</th>
                    <th>Acc (%)</th>
                </tr>
            </thead>
            <tbody id="input-list"></tbody>
        </table>
    </div>

    <div id="result-screen" class="screen">
        <button class="save-btn" onclick="saveAsImage()">📸 結果を画像として保存</button>
        
        <div id="capture-area">
            <div class="rating-display" id="total-rating">Total Rate: 0.00</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th style="text-align: left; padding-left: 55px;">曲名</th>
                        <th>Acc</th>
                        <th>Rate</th>
                    </tr>
                </thead>
                <tbody id="result-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- 曲データ（imageに画像パスを追加できます） ---
    const songData = [
        { name: "Shining (feat. 藍月なくる)", constant: 22.0, image: "images/shining.jpg" },
        { name: "World's end BLACKBOX", constant: 47.0, image: "images/blackbox.png" },
        { name: "ソテリア", constant: 19.0, image: "" },
        { name: "LΛ8YRИTH", constant: 42.0, image: "" },
        { name: "AMA", constant: 40.0, image: "" }
    ];

    let savedAccs = JSON.parse(localStorage.getItem('malody_acc_data')) || {};
    let currentSortKey = 'constant'; 
    let isAsc = false;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        event.target.classList.add('active');
        refresh();
    }

    function calculateSingleRate(acc, constant) {
        if (!acc || acc <= 0) return 0;
        let bonus = 0;
        if (acc >= 100) bonus = 3.0;
        else if (acc >= 99.90) bonus = 2.0;
        else if (acc >= 99.50) bonus = 1.5;
        else if (acc >= 99.00) bonus = 1.0;
        else if (acc >= 98.50) bonus = 0.8;
        else if (acc >= 98.00) bonus = 0.5;
        else if (acc >= 97.00) bonus = 0;
        else bonus = -Math.floor((97.00 - acc) / 0.5) * 0.5;
        return Math.max(0, constant + bonus);
    }

    function updateRatingStyle(totalRate) {
        const display = document.getElementById('total-rating');
        display.innerText = `Total Rate: ${totalRate}`;
        display.classList.remove('rate-rainbow', 'rate-gold', 'rate-silver', 'rate-normal');

        const val = parseFloat(totalRate);
        if (val >= 16.0) display.classList.add('rate-rainbow');
        else if (val >= 15.0) display.classList.add('rate-gold');
        else if (val >= 14.0) display.classList.add('rate-silver');
        else display.classList.add('rate-normal');
    }

    function refresh() {
        const inputTbody = document.getElementById('input-list');
        const resultTbody = document.getElementById('result-list');
        
        let allResults = songData.map((song, index) => {
            const acc = savedAccs[index] || 0;
            const rate = calculateSingleRate(acc, song.constant);
            return { ...song, acc, rate, index };
        });

        // 入力画面描画
        let inputSorted = [...allResults].sort((a, b) => {
            let valA = a[currentSortKey]; let valB = b[currentSortKey];
            if (typeof valA === 'string') return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            return isAsc ? valA - valB : valB - valA;
        });

        inputTbody.innerHTML = '';
        inputSorted.forEach(s => {
            inputTbody.innerHTML += `
                <tr>
                    <td style="text-align:left"><img src="${s.image || ''}" class="jacket-img" onerror="this.style.display='none'">${s.name}</td>
                    <td>${s.constant.toFixed(1)}</td>
                    <td><input type="number" value="${s.acc || ''}" step="0.01" oninput="updateAcc(${s.index}, this.value)"></td>
                </tr>
            `;
        });

        // 結果画面描画
        let resultSorted = [...allResults].sort((a, b) => b.rate - a.rate).slice(0, 30);
        const top30Sum = resultSorted.reduce((sum, s) => sum + s.rate, 0);
        const totalRate = (top30Sum / 30).toFixed(2);
        
        updateRatingStyle(totalRate);

        resultTbody.innerHTML = '';
        resultSorted.forEach((s, i) => {
            if(s.rate <= 0) return;
            resultTbody.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td style="text-align: left;">
                        <img src="${s.image || ''}" class="jacket-img" onerror="this.style.display='none'">
                        ${s.name}
                    </td>
                    <td>${s.acc.toFixed(2)}%</td>
                    <td>${s.rate.toFixed(2)}</td>
                </tr>
            `;
        });
    }

    function setSort(key) {
        if (currentSortKey === key) isAsc = !isAsc;
        else { currentSortKey = key; isAsc = false; }
        refresh();
    }

    function updateAcc(index, value) {
        savedAccs[index] = parseFloat(value) || 0;
        localStorage.setItem('malody_acc_data', JSON.stringify(savedAccs));
        
        // 裏でトータルレートだけ更新
        const allRates = songData.map((song, idx) => calculateSingleRate(savedAccs[idx] || 0, song.constant));
        const top30 = allRates.sort((a, b) => b - a).slice(0, 30);
        const total = (top30.reduce((a, b) => a + b, 0) / 30).toFixed(2);
        updateRatingStyle(total);
    }

    function saveAsImage() {
        const area = document.getElementById('capture-area');
        html2canvas(area, { 
            useCORS: true,
            backgroundColor: "#ffffff",
            scale: 2 // 高画質化
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'malody-best30.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    refresh();
</script>

</body>
</html>
