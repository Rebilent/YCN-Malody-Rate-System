<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malody Best 30 Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .rating-display { text-align: center; font-size: 40px; font-weight: bold; margin: 20px 0; padding: 15px; background: #e8f4fd; border-radius: 8px; color: #333; }
        .rate-rainbow { background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); -webkit-background-clip: text !important; background-clip: text !important; color: rgba(0,0,0,0.2); -webkit-text-fill-color: transparent; background-size: 200% auto; animation: rainbow-move 3s linear infinite; }
        @keyframes rainbow-move { to { background-position: 200% center; } }
        
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #bdc3c7; color: white; font-weight: bold; }
        .nav-btn.active { background: #3498db; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { background: #3498db; color: white; padding: 10px; }
        td { padding: 12px 8px; border-bottom: 1px solid #eee; text-align: center; }
        .section-title { background: #2c3e50; color: white; padding: 10px; margin: 20px 0 10px; border-radius: 5px; font-size: 1.2em; }
        
        input[type="number"] { width: 65px; padding: 5px; border-radius: 4px; border: 1px solid #ddd; }
        .fc-label { color: #e67e22; font-weight: bold; font-size: 0.8em; margin-left: 5px; }
        .save-btn { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1.1em; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Malody Best 30</h1>
    
    <div class="nav-buttons">
        <button class="nav-btn active" onclick="showScreen('input-screen', this)">データ入力</button>
        <button class="nav-btn" onclick="showScreen('result-screen', this)">ベスト枠表示</button>
    </div>

    <div id="input-screen" class="screen active">
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')" style="cursor:pointer">曲名 ↕</th>
                    <th onclick="setSort('constant')" style="cursor:pointer">定数 ↕</th>
                    <th>Acc (%)</th>
                    <th>FC</th>
                </tr>
            </thead>
            <tbody id="input-list"></tbody>
        </table>
    </div>

    <div id="result-screen" class="screen">
        <button class="save-btn" onclick="saveAsImage()">📸 画像として保存</button>
        <div id="capture-area" style="background: white; padding: 20px;">
            <div class="rating-display" id="total-rating">Total Rate: 0.00</div>
            
            <div class="section-title">Best 30 Songs</div>
            <table><tbody id="best-list"></tbody></table>

            <div class="section-title">Candidates (31st～)</div>
            <table><tbody id="sub-list"></tbody></table>
        </div>
    </div>
</div>

<script>
    const songData = [
        { name: "Shining (feat. 藍月なくる)", constant: 22.0 },
        { name: "World's end BLACKBOX", constant: 47.0 },
        { name: "ソテリア", constant: 19.0 },
        { name: "LΛ8YRИTH", constant: 42.0 },
        { name: "AMA", constant: 40.0 },
        { name: "Attractor Dimension", constant: 43.0 },
        { name: "Onus Regulus", constant: 44.0 },
        { name: "SELENE-UI", constant: 41.0 },
        { name: "ARTEMiS", constant: 29.0 },
        { name: "Redemptione", constant: 37.0 },
        { name: "第六天魔王", constant: 38.0 },
        { name: "Deicide feat.古泉葉", constant: 29.0 },
        { name: "Flechette", constant: 27.0 },
        { name: "天照らす律動", constant: 28.0 },
        { name: "The King's Return", constant: 45.0 },
        { name: "The Devil Incarnate", constant: 41.0 },
        { name: "QiXiN MAdN3ss 2153", constant: 40.0 },
        { name: "ZEUS", constant: 41.0 },
        { name: "∀NØMALY", constant: 40.0 },
        { name: "raputa", constant: 39.0 },
        { name: "How To Make 音ゲ～曲！", constant: 37.0 },
        { name: "#1f1e33", constant: 37.0 },
        { name: "鳳", constant: 41.0 },
        { name: "国士無双", constant: 38.0 },
        { name: "儚姫は原初に舞う", constant: 36.0 },
        { name: "Red to Red", constant: 27.0 },
        { name: "Re : Unknown X", constant: 44.0 },
        { name: "Apollo", constant: 39.0 },
        { name: "SuddenИDeath", constant: 40.0 },
        { name: "Wolves Standing Towards Enemies", constant: 36.0 },
        { name: "Pendemonium", constant: 37.0 },
        { name: "THE PEERLESS UNDER HEAVEN", constant: 34.0 },
        { name: "魔王", constant: 39.0 },
        { name: "Spin Eternally", constant: 38.0 },
        { name: "CUT! into the FUTURE", constant: 38.0 },
        { name: "7thSense", constant:31.0},
        { name: "Dimensional Exploration", constant:38.0},
        { name: "A.O.E::area_of_effect", constant:38.0},
        { name: "MAYHEM(DETRUO RE)", constant:40.0},
        { name: "LUNATiC CiRCUiT", constant:34.0},
        { name: "R'N'R Monsta ", constant:34.0},
        { name: "Synthesis.", constant:38.0},
        { name: "NeruNeru-Chan travels to the Luminous Stars!", constant:37.0},
        { name: "燐華", constant:37.0},
        { name: "Last Wish", constant:39.0},
        //{ name: "", constant:},
    ];

    let savedData = JSON.parse(localStorage.getItem('malody_play_data_v2')) || {};
    let currentSortKey = 'constant'; 
    let isAsc = false;

    function calculateSingleRate(acc, constant, isFC) {
        if (!acc || acc <= 0) return 0;
        let bonus = 0;
        if (acc >= 100) bonus = 2.5;
        else if (acc >= 99.50) bonus = 2.0 + (acc - 99.50);
        else if (acc >= 99.00) bonus = 1.5 + (acc - 99.00);
        else if (acc >= 98.50) bonus = 1.3 + (acc - 98.50);
        else if (acc >= 98.00) bonus = 1.1 + (acc - 98.00);
        else if (acc >= 97.50) bonus = 0.9 + (acc - 97.50);
        else if (acc >= 97.00) bonus = 0.7 + (acc - 97.00);
        else if (acc >= 96.50) bonus = 0.5 + (acc - 96.50);
        else if (acc >= 96.00) bonus = 0.3 + (acc - 96.00);
        else if (acc >= 95.50) bonus = 0.1 + (acc - 95.50);
        else if (acc >= 95.00) bonus = 0;
        else bonus = -Math.floor((95.00 - acc) / 0.5) * 0.5;

        let finalRate = constant + bonus;
        if (isFC && acc < 100) finalRate += 0.2;
        return Math.max(0, finalRate);
    }

    function refresh() {
        const inputTbody = document.getElementById('input-list');
        const bestList = document.getElementById('best-list');
        const subList = document.getElementById('sub-list');

        let all = songData.map((s, i) => {
            const d = savedData[i] || { acc: 0, fc: false };
            return { ...s, ...d, rate: calculateSingleRate(d.acc, s.constant, d.fc), index: i };
        });

        // 入力画面
        inputTbody.innerHTML = '';
        [...all].sort((a,b) => {
            let valA = a[currentSortKey]; let valB = b[currentSortKey];
            if(typeof valA === 'string') return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            return isAsc ? valA - valB : valB - valA;
        }).forEach(s => {
            inputTbody.innerHTML += `<tr><td style="text-align:left">${s.name}</td><td>${s.constant}</td><td><input type="number" value="${s.acc||''}" oninput="update(${s.index},'acc',this.value)"></td><td><input type="checkbox" ${s.fc?'checked':''} onchange="update(${s.index},'fc',this.checked)"></td></tr>`;
        });

        // レート順にソートして上位30曲を取得
        let sortedAll = all.sort((a,b) => b.rate - a.rate);
        let top30 = sortedAll.slice(0, 30);
        let candidates = sortedAll.slice(30, 40);

        // トータルレート計算 (上位30曲の平均)
        const total = (top30.reduce((a,b)=>a+b.rate, 0) / 30).toFixed(2);
        const display = document.getElementById('total-rating');
        display.innerText = `Total Rate: ${total}`;
        display.className = 'rating-display ' + (total >= 16 ? 'rate-rainbow' : '');

        const renderTable = (list, target, startIdx) => {
            target.innerHTML = list.map((s,i) => `<tr><td width="30">${startIdx + i + 1}</td><td style="text-align:left">${s.name}${s.fc?' <span class="fc-label">FC</span>':''}</td><td width="80">${s.acc.toFixed(2)}%</td><td width="60">${s.rate.toFixed(2)}</td></tr>`).join('');
        };

        renderTable(top30, bestList, 0);
        renderTable(candidates, subList, 30);
    }

    function update(i, k, v) {
        if(!savedData[i]) savedData[i] = {acc:0, fc:false};
        savedData[i][k] = k === 'acc' ? parseFloat(v) || 0 : v;
        localStorage.setItem('malody_play_data_v2', JSON.stringify(savedData));
        refresh();
    }

    function setSort(key) {
        if (currentSortKey === key) isAsc = !isAsc;
        else { currentSortKey = key; isAsc = false; }
        refresh();
    }

    function showScreen(id, btn) {
        document.querySelectorAll('.screen, .nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        refresh();
    }

    function saveAsImage() {
        html2canvas(document.getElementById('capture-area'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'best30_result.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    refresh();
</script>
</body>
</html>
