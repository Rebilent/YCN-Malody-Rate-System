<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malody Best 30 Calculator</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .rating-display { text-align: center; font-size: 32px; font-weight: bold; color: #3498db; margin: 20px 0; padding: 10px; background: #e8f4fd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #3498db; color: white; padding: 12px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        input[type="number"] { width: 80px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; }
        tr.top-30 { background-color: #fff9e6; } /* 上位30曲を少し目立たせる */
    </style>
</head>
<body>

<div class="container">
    <h1>Malody Best 30</h1>
    <div class="rating-display" id="total-rating">Total Rate: 0.00</div>

    <table>
       <thead>
    <tr>
        <th onclick="setSort('name')" style="cursor:pointer">曲名 ↕</th>
        <th onclick="setSort('constant')" style="cursor:pointer">難易度 ↕</th>
        <th onclick="setSort('acc')" style="cursor:pointer">Acc (%) ↕</th>
        <th onclick="setSort('rate')" style="cursor:pointer">単曲レート ↕</th>
    </tr>
        </thead>
        <tbody id="song-list">
            </tbody>
    </table>
</div>

<script>
     // --- ここに曲を追加していけます ---
    const songData = [
        { name: "Shining (feat. 藍月なくる)", constant: 22.0 },
        { name: "World's end BLACKBOX", constant: 47.0 },
        { name: "ソテリア", constant: 19.0 },
        { name: "LΛ8YRИTH", constant: 42.0 },
        { name: "AMA", constant: 40.0}
        // ... 好きなだけ追加可能
    ];

    // 保存されているAccデータを読み込む
    let savedAccs = JSON.parse(localStorage.getItem('malody_acc_data')) || {};
    // 保存されているデータを読み込む
let savedAccs = JSON.parse(localStorage.getItem('malody_acc_data')) || {};
let currentSortKey = 'rate'; // 初期はレート順
let isAsc = false;           // 初期は降順（大きい順）

function calculateSingleRate(acc, constant) {
    if (!acc || acc <= 0) return 0;
    let bonus = 0;
    if (acc >= 100) bonus = 3.0;
    else if (acc >= 99.90) bonus = 2.0;
    else if (acc >= 99.50) bonus = 1.5;
    else if (acc >= 99.00) bonus = 1.0;
    else if (acc >= 98.50) bonus = 0.8;
    else if (acc >= 98.00) bonus = 0.5;
    else if (acc >= 97.00) bonus = 0;
    else bonus = -Math.floor((97.00 - acc) / 0.5) * 0.5;
    return Math.max(0, constant + bonus);
}

function refresh() {
    const tbody = document.getElementById('song-list');
    let results = songData.map((song, index) => {
        const acc = savedAccs[index] || 0;
        const rate = calculateSingleRate(acc, song.constant);
        return { ...song, acc, rate, index };
    });

    // --- ソート処理 ---
    results.sort((a, b) => {
        let valA = a[currentSortKey];
        let valB = b[currentSortKey];
        
        // 文字列（曲名）の場合は比較方法を変える
        if (typeof valA === 'string') {
            return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        // 数値（定数、レート）の場合
        return isAsc ? valA - valB : valB - valA;
    });

    // トータルレート計算（ソートとは別に、純粋に上位30曲を抽出）
    const top30 = [...results].sort((a, b) => b.rate - a.rate).slice(0, 30);
    const top30Sum = top30.reduce((sum, s) => sum + s.rate, 0);
    const totalRate = (top30Sum / 30).toFixed(2);
    document.getElementById('total-rating').innerText = `Total Rate: ${totalRate}`;

    // 描画
    tbody.innerHTML = '';
    const top30Ids = new Set(top30.map(s => s.index)); // 上位30曲のIDを保持

    results.forEach((s) => {
        const rowClass = top30Ids.has(s.index) ? 'top-30' : '';
        tbody.innerHTML += `
            <tr class="${rowClass}">
                <td>${s.name}</td>
                <td>${s.constant.toFixed(1)}</td>
                <td><input type="number" value="${s.acc || ''}" step="0.01" oninput="updateAcc(${s.index}, this.value)"></td>
                <td>${s.rate.toFixed(2)}</td>
            </tr>
        `;
    });
}

// ソートを切り替える関数
function setSort(key) {
    if (currentSortKey === key) {
        isAsc = !isAsc; // 同じキーなら昇順・降順を反転
    } else {
        currentSortKey = key;
        isAsc = false; // 新しいキーなら降順からスタート
    }
    refresh();
}

function updateAcc(index, value) {
    savedAccs[index] = parseFloat(value) || 0;
    localStorage.setItem('malody_acc_data', JSON.stringify(savedAccs));
    refresh();
}

refresh();
</script>

</body>
</html>
