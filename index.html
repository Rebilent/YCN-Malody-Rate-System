<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malody Best 30 Calculator</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        
        /* ナビゲーションボタン */
        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #bdc3c7; color: white; font-weight: bold; transition: 0.3s; }
        .nav-btn.active { background: #3498db; }
        
        /* 画面の表示・非表示 */
        .screen { display: none; }
        .screen.active { display: block; }

        .rating-display { text-align: center; font-size: 32px; font-weight: bold; color: #3498db; margin: 20px 0; padding: 10px; background: #e8f4fd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #3498db; color: white; padding: 12px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        input[type="number"] { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        tr.top-30 { background-color: #fff9e6; }
        
        .info-card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>Malody Best 30</h1>

    <div class="nav-buttons">
        <button class="nav-btn active" onclick="showScreen('input-screen')">Acc入力</button>
        <button class="nav-btn" onclick="showScreen('result-screen')">ベスト枠表示</button>
    </div>

    <div id="input-screen" class="screen active">
        <div class="info-card">
            <p>各曲のAccを入力してください。データは自動保存されます。</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')" style="cursor:pointer">曲名 ↕</th>
                    <th onclick="setSort('constant')" style="cursor:pointer">難易度 ↕</th>
                    <th>Acc (%)</th>
                </tr>
            </thead>
            <tbody id="input-list"></tbody>
        </table>
    </div>

    <div id="result-screen" class="screen">
        <div class="rating-display" id="total-rating">Total Rate: 0.00</div>
        <div class="info-card">
            <p>現在のベスト30曲（レートが高い順）です。</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>順位</th>
                    <th>曲名</th>
                    <th>Acc</th>
                    <th>単曲レート</th>
                </tr>
            </thead>
            <tbody id="result-list"></tbody>
        </table>
    </div>
</div>

<script>
    // --- 曲データ ---
    const songData = [
        { name: "Shining (feat. 藍月なくる)", constant: 22.0 },
        { name: "World's end BLACKBOX", constant: 47.0 },
        { name: "ソテリア", constant: 19.0 },
        { name: "LΛ8YRИTH", constant: 42.0 },
        { name: "AMA", constant: 40.0 }
    ];

    let savedAccs = JSON.parse(localStorage.getItem('malody_acc_data')) || {};
    let currentSortKey = 'constant'; 
    let isAsc = false;

    // 画面を切り替える関数
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(screenId).classList.add('active');
        event.target.classList.add('active');
        
        refresh(); // 切り替え時に再描画
    }

    function calculateSingleRate(acc, constant) {
        if (!acc || acc <= 0) return 0;
        let bonus = 0;
        if (acc >= 100) bonus = 3.0;
        else if (acc >= 99.90) bonus = 2.0;
        else if (acc >= 99.50) bonus = 1.5;
        else if (acc >= 99.00) bonus = 1.0;
        else if (acc >= 98.50) bonus = 0.8;
        else if (acc >= 98.00) bonus = 0.5;
        else if (acc >= 97.00) bonus = 0;
        else bonus = -Math.floor((97.00 - acc) / 0.5) * 0.5;
        return Math.max(0, constant + bonus);
    }

    function refresh() {
        const inputTbody = document.getElementById('input-list');
        const resultTbody = document.getElementById('result-list');
        
        let allResults = songData.map((song, index) => {
            const acc = savedAccs[index] || 0;
            const rate = calculateSingleRate(acc, song.constant);
            return { ...song, acc, rate, index };
        });

        // --- 入力画面用のソート ---
        let inputSorted = [...allResults].sort((a, b) => {
            let valA = a[currentSortKey];
            let valB = b[currentSortKey];
            if (typeof valA === 'string') return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            return isAsc ? valA - valB : valB - valA;
        });

        // --- 入力テーブル描画 ---
        inputTbody.innerHTML = '';
        inputSorted.forEach(s => {
            inputTbody.innerHTML += `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.constant.toFixed(1)}</td>
                    <td><input type="number" value="${s.acc || ''}" step="0.01" oninput="updateAcc(${s.index}, this.value)"></td>
                </tr>
            `;
        });

        // --- 結果画面用（レート順に上位30曲） ---
        let resultSorted = [...allResults].sort((a, b) => b.rate - a.rate).slice(0, 30);
        const top30Sum = resultSorted.reduce((sum, s) => sum + s.rate, 0);
        document.getElementById('total-rating').innerText = `Total Rate: ${(top30Sum / 30).toFixed(2)}`;

        resultTbody.innerHTML = '';
        resultSorted.forEach((s, i) => {
            if(s.rate <= 0) return; // 0レートは表示しない
            resultTbody.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${s.name}</td>
                    <td>${s.acc.toFixed(2)}%</td>
                    <td>${s.rate.toFixed(2)}</td>
                </tr>
            `;
        });
    }

    function setSort(key) {
        if (currentSortKey === key) isAsc = !isAsc;
        else { currentSortKey = key; isAsc = false; }
        refresh();
    }

    function updateAcc(index, value) {
        savedAccs[index] = parseFloat(value) || 0;
        localStorage.setItem('malody_acc_data', JSON.stringify(savedAccs));
        // 入力画面では、入力の邪魔にならないようトータル計算だけ裏で行う（再描画はしない）
        const allResults = songData.map((song, idx) => {
            const acc = savedAccs[idx] || 0;
            return calculateSingleRate(acc, song.constant);
        });
        const top30 = allResults.sort((a, b) => b - a).slice(0, 30);
        const total = (top30.reduce((a, b) => a + b, 0) / 30).toFixed(2);
        document.getElementById('total-rating').innerText = `Total Rate: ${total}`;
    }

    refresh();
</script>

</body>
</html>
